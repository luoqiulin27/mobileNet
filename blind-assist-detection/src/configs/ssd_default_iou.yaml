project:
  name: "blind-assist-detection-iou"
  seed: 42

data:
  root: "data/sanpo_obstacle_8class"
  image_dir: "data/sanpo_obstacle_8class/images/all"
  label_dir: "data/sanpo_obstacle_8class/labels/all"
  train_list: "data/sanpo_obstacle_8class/meta/train.txt"
  val_list: "data/sanpo_obstacle_8class/meta/val.txt"
  test_list: "data/sanpo_obstacle_8class/meta/test.txt"
  classes_file: "data/sanpo_obstacle_8class/configs/classes.txt"
  num_classes: 8

model:
  backbone: "mobilenet_v2"
  pretrained: true
  input_size: [300, 300]
  num_classes: 9
  use_eca: false
  eca_stages: [0, 1, 2, 3, 4]

augmentation:
  train:
    hsv_h: 0.015
    hsv_s: 0.7
    hsv_v: 0.4
    flip_prob: 0.5
    random_crop: true
  val: {}

anchors:
  feature_maps: [19, 10, 5, 3, 2]
  min_sizes: [30, 60, 111, 162, 213]
  max_sizes: [60, 111, 162, 213, 264]
  aspect_ratios: [[2], [2, 3], [2, 3], [2, 3], [2]]
  clip: true

training:
  epochs: 100
  batch_size: 32
  num_workers: 4
  optimizer: "sgd"
  learning_rate: 0.001
  momentum: 0.9
  weight_decay: 0.0005
  warmup_epochs: 5
  scheduler: "cosine"
  freeze_backbone_epochs: 10

loss:
  loc_weight: 1.0
  conf_weight: 1.0
  neg_pos_ratio: 3
  box_loss: "iou"

evaluation:
  iou_threshold: 0.5
  conf_threshold: 0.3

inference:
  conf_threshold: 0.3
  nms_threshold: 0.45
  max_detections: 50

export:
  onnx_path: "exports/model_iou.onnx"
  tflite_path: "exports/model_iou.tflite"
