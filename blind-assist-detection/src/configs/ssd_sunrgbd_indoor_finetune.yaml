project:
  name: "blind-assist-detection-sunrgbd-indoor-finetune"
  seed: 42

data:
  root: "data/sunrgbd_indoor_12class"
  image_dir: "data/sunrgbd_indoor_12class/images/all"
  label_dir: "data/sunrgbd_indoor_12class/labels/all"
  train_list: "data/sunrgbd_indoor_12class/meta/train.txt"
  val_list: "data/sunrgbd_indoor_12class/meta/val.txt"
  test_list: "data/sunrgbd_indoor_12class/meta/test.txt"
  classes_file: "data/sunrgbd_indoor_12class/configs/classes.txt"
  num_classes: 12

model:
  backbone: "mobilenet_v2"
  pretrained: true
  input_size: [300, 300]
  num_classes: 13

augmentation:
  train:
    hsv_h: 0.015
    hsv_s: 0.55
    hsv_v: 0.35
    flip_prob: 0.5
    random_crop: true
  val: {}

anchors:
  feature_maps: [19, 10, 5, 3, 2]
  min_sizes: [24, 52, 102, 156, 212]
  max_sizes: [52, 102, 156, 212, 268]
  aspect_ratios: [[2], [2, 3], [2, 3], [2, 3], [2]]
  clip: true

training:
  epochs: 30
  batch_size: 32
  num_workers: 6
  optimizer: "sgd"
  learning_rate: 0.0001
  momentum: 0.9
  weight_decay: 0.0005
  warmup_epochs: 0
  scheduler: "cosine"
  freeze_backbone_epochs: 2

loss:
  loc_weight: 1.0
  conf_weight: 1.0
  neg_pos_ratio: 3

evaluation:
  iou_threshold: 0.5
  conf_threshold: 0.2

inference:
  conf_threshold: 0.15
  nms_threshold: 0.45
  max_detections: 50

export:
  onnx_path: "exports/sunrgbd_indoor_finetune.onnx"
  tflite_path: "exports/sunrgbd_indoor_finetune.tflite"
