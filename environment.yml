name: blind-assist
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python=3.9

  # 深度学习框架
  - pytorch>=2.0.0
  - torchvision>=0.15.0
  - pytorch-cuda=12.4

  # 数据处理
  - numpy>=1.24.0
  - pillow>=9.0.0
  - opencv>=4.7.0

  # 机器学习
  - scikit-learn>=1.2.0

  # 配置
  - pyyaml>=6.0

  # 可视化
  - matplotlib>=3.7.0

  # 进度条
  - tqdm>=4.65.0

  # pip 额外依赖
  - pip:
    - tensorboard>=2.12.0
    - onnx>=1.14.0
    - onnxruntime>=1.14.0
